<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PDF Editor</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; overscroll-behavior: none; font: 14px system-ui, sans-serif; }
      body { display: flex; flex-direction: column; }
      #viewer { flex: 1; min-height: 0; }
      #viewer.text-armed { cursor: crosshair; }
      #empty { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 10px; opacity: 0.85; text-align: center; padding: 16px; }
      #empty strong { font-size: 18px; }
      #empty button, #empty select { font: inherit; padding: 6px 14px; }
      #empty [hidden] { display: none; }
      /* Status / error line (the editor's only toolbar is EmbedPDF's own, so messages float over the page). */
      #status { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 2000;
        max-width: min(640px, calc(100vw - 32px)); padding: 6px 14px; border-radius: 8px; font-size: 13px;
        background: #1f2937; color: #fff; box-shadow: 0 2px 10px #0004; pointer-events: none; }
      #status:empty { display: none; }
      #status.error { background: #dc2626; }
      /* Tablet mode: no browser pinch-zoom of the app chrome (the PDF pinch is EmbedPDF's own). */
      html.tablet, html.tablet body { touch-action: pan-x pan-y; }
      html.tablet #viewer { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
      html.tablet #empty button, html.tablet #empty select { min-height: 40px; }
      /* Text stamp dialog (tablet gesture: double-tap, hold the second tap, optionally drag a box). */
      #textStampDialog { border: 1px solid #8886; border-radius: 10px; padding: 16px;
        width: min(480px, calc(100vw - 32px)); background: Canvas; color: CanvasText; }
      #textStampDialog::backdrop { background: rgba(0, 0, 0, 0.4); }
      #textStampDialog h3 { margin: 0 0 8px; font-size: 14px; }
      #textStampDialog textarea { width: 100%; box-sizing: border-box; font: inherit; font-size: 18px;
        padding: 8px; resize: vertical; user-select: text; -webkit-user-select: text; }
      #textStampDialog .buttons { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
      #textStampDialog .buttons .spacer { flex: 1; }
      #textStampDialog .dir { display: flex; align-items: center; gap: 6px; }
      /* With the live preview on the page: docked top/bottom (inline style), page stays visible behind it. */
      #textStampDialog.with-preview { padding: 12px; }
      #textStampDialog.with-preview::backdrop { background: transparent; }
      #textStampDialog.with-preview .buttons { flex-wrap: wrap; }
      html.tablet #textStampDialog button { min-height: 40px; }
    </style>
  </head>
  <body>
    <div id="viewer">
      <div id="empty">
        <strong>No PDF open</strong>
        <button id="open" title="Open a PDF (Ctrl+O). You can also drop a file on the window.">Open…</button>
        <input id="fileInput" type="file" accept="application/pdf,.pdf" hidden />
        <select id="recents" title="Recent files" hidden></select>
        <span>Open a file (Ctrl+O) or drop a .pdf on this window.</span>
      </div>
    </div>
    <div id="status" role="status"></div>
    <script type="module" src="/assets/pdfium.js"></script>
  </body>
</html>
