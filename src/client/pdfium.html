<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PDF Editor</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; overscroll-behavior: none; font: 14px system-ui, sans-serif; }
      body { display: flex; flex-direction: column; }
      #bar { display: flex; gap: 8px; align-items: center; padding: 6px 10px; border-bottom: 1px solid #8884; }
      #bar select { max-width: 30vw; }
      #bar [hidden] { display: none; }
      #bar #fileName { font-weight: 600; max-width: 30vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #empty { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 6px; opacity: 0.7; text-align: center; padding: 16px; }
      #empty strong { font-size: 18px; }
      #bar .spacer { flex: 1; }
      #viewer { flex: 1; min-height: 0; }
      #bar button { font: inherit; padding: 4px 10px; }
      #bar button:disabled { opacity: 0.5; }
      #bar button.primary { font-weight: 600; }
      #bar #status { font-size: 12px; opacity: 0.8; }
      #bar #status.error { color: #dc2626; opacity: 1; }
      #viewer.text-armed { cursor: crosshair; }
      #bar button.active { background: #2563eb; color: #fff; border-color: #2563eb; }
      /* Tablet mode: no browser pinch-zoom of the app chrome (the PDF pinch is EmbedPDF's own). */
      html.tablet, html.tablet body { touch-action: pan-x pan-y; }
      html.tablet #viewer { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
      html.tablet #bar button, html.tablet #bar select { min-height: 40px; }
      /* Text stamp dialog (tablet gesture: double-tap, hold the second tap). */
      #textStampDialog { border: 1px solid #8886; border-radius: 10px; padding: 16px;
        width: min(480px, calc(100vw - 32px)); background: Canvas; color: CanvasText; }
      #textStampDialog::backdrop { background: rgba(0, 0, 0, 0.4); }
      #textStampDialog h3 { margin: 0 0 8px; font-size: 14px; }
      #textStampDialog textarea { width: 100%; box-sizing: border-box; font: inherit; font-size: 18px;
        padding: 8px; resize: vertical; user-select: text; -webkit-user-select: text; }
      #textStampDialog .buttons { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
      #textStampDialog .buttons .spacer { flex: 1; }
      #textStampDialog .dir { display: flex; align-items: center; gap: 6px; }
    </style>
  </head>
  <body>
    <div id="bar">
      <button id="open" title="Open a PDF (Ctrl+O). You can also drop a file on the window." hidden>Open…</button>
      <select id="recents" title="Recent files" hidden></select>
      <span id="fileName"></span>
      <button id="textTool" title="Add text: click where it should go. Hebrew / RTL safe. Double-click a text stamp to edit it.">Text</button>
      <button id="tabletToggle" title="Tablet mode: pen draws (barrel button erases), finger scrolls / pinch-zooms / double-tap toggles fit, double-tap + hold adds text, mouse never draws">Tablet</button>
      <span class="spacer"></span>
      <span id="status"></span>
      <button id="saveAs" title="Save a copy under a new name (Ctrl+Shift+S)" hidden disabled>Save As…</button>
      <button id="save" class="primary" disabled title="Save changes to the file (Ctrl+S)">Save</button>
    </div>
    <div id="viewer">
      <div id="empty"><strong>No PDF open</strong><span>Open a file (Ctrl+O) or drop a .pdf on this window.</span></div>
    </div>
    <script type="module" src="/assets/pdfium.js"></script>
  </body>
</html>
